<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web CCTV</title>

    <link
        rel="stylesheet"
        href="./style.css?v=100"
    >

</head>

<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div
    id="loginScreen"
    class="screen"
>

    <div class="loginBox">

        <h1>📹 Web CCTV</h1>

        <p>
            Enter the same password on both devices.
        </p>

        <input
            id="password"
            type="password"
            placeholder="CCTV password"
            autocomplete="off"
        >

        <button
            id="cameraButton"
            class="mainButton"
        >
            📱 Use as Camera
        </button>

        <button
            id="monitorButton"
            class="mainButton"
        >
            💻 Use as Monitor
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- =========================================================
     PHONE / CAMERA
========================================================= -->

<div
    id="cameraScreen"
    class="screen hidden"
>

    <video
        id="localVideo"
        autoplay
        muted
        playsinline
    ></video>


    <div class="cameraTop">

        <b>📱 CCTV CAMERA</b>

        <span id="cameraClock">
            00:00:00
        </span>

    </div>


    <div
        id="cameraConnection"
        class="connection"
    >
        Starting camera...
    </div>


    <div class="cameraControls">

        <button
            id="flipCamera"
            class="controlButton"
        >
            🔄 FLIP
        </button>

        <button
            id="cameraStop"
            class="disconnectButton"
            onclick="disconnectEverything()"
        >
            🔌 DISCONNECT
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        OFFLINE
    </div>

</div>


<!-- =========================================================
     LAPTOP / MONITOR
========================================================= -->

<div
    id="monitorScreen"
    class="screen hidden"
>

    <video
        id="remoteVideo"
        autoplay
        playsinline
    ></video>


    <div class="monitorTop">

        <b>💻 CCTV MONITOR</b>

        <span id="monitorClock">
            00:00:00
        </span>

    </div>


    <div
        id="waitingMessage"
        class="waiting"
    >

        📹

        <br>

        Waiting for camera...

    </div>


    <div
        id="monitorLive"
        class="live hidden"
    >
        ● LIVE
    </div>


    <div class="monitorControls">

        <button
            id="attentionButton"
            class="attentionButton"
        >
            ⚠️ ATTENTION
        </button>


        <button
            id="fullscreen"
            class="controlButton"
        >
            ⛶ FULLSCREEN
        </button>


        <button
            id="monitorStop"
            class="disconnectButton"
            onclick="disconnectEverything()"
        >
            🔌 DISCONNECT
        </button>

    </div>

</div>


<!-- =========================================================
     PEERJS
========================================================= -->

<script
    src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
></script>


<!-- =========================================================
     SCRIPT
========================================================= -->

<script
    src="./script.js?v=100"
></script>


</body>
</html>
