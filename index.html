<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web CCTV</title>

    <link
        rel="stylesheet"
        href="./style.css?v=3"
    >

</head>


<body>

    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div
        id="loginScreen"
        class="screen"
    >

        <div class="loginBox">

            <h1>📹 Web CCTV</h1>

            <p class="subtitle">
                Enter the same password on both devices.
            </p>


            <input
                id="password"
                type="password"
                placeholder="CCTV password"
                autocomplete="off"
            >


            <button
                id="cameraButton"
                class="mainButton"
            >
                📱 Use as Camera
            </button>


            <button
                id="monitorButton"
                class="mainButton monitorButton"
            >
                💻 Use as Monitor
            </button>


            <div
                id="error"
                class="error"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         PHONE CAMERA
    ====================================================== -->

    <div
        id="cameraScreen"
        class="screen hidden"
    >

        <div class="topBar">

            <div>
                📱 CAMERA
            </div>

            <div
                id="cameraClock"
                class="clock"
            >
                00:00:00
            </div>

        </div>


        <div class="cameraContainer">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>


            <div
                id="cameraConnection"
                class="connection"
            >
                Starting camera...
            </div>

        </div>


        <div class="cameraControls">

            <button
                id="flipCamera"
                class="controlButton"
            >
                🔄 Flip Camera
            </button>


            <button
                id="cameraStop"
                class="controlButton stopButton"
            >
                ❌ Disconnect
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
            OFFLINE
        </div>

    </div>


    <!-- =====================================================
         LAPTOP MONITOR
    ====================================================== -->

    <div
        id="monitorScreen"
        class="screen hidden"
    >

        <div class="topBar">

            <div>
                💻 CCTV MONITOR
            </div>

            <div
                id="monitorClock"
                class="clock"
            >
                00:00:00
            </div>

        </div>


        <div class="monitorContainer">

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>


            <div
                id="waitingMessage"
                class="waiting"
            >

                <div class="waitingIcon">
                    📹
                </div>

                <div>
                    Waiting for camera...
                </div>

            </div>


            <div
                id="monitorLive"
                class="live hidden"
            >
                ● LIVE
            </div>

        </div>


        <div class="monitorControls">

            <button
                id="attentionButton"
                class="attentionButton"
            >
                ⚠️ ATTENTION
            </button>


            <button
                id="fullscreen"
                class="controlButton"
            >
                ⛶ Fullscreen
            </button>


            <button
                id="monitorStop"
                class="controlButton stopButton"
            >
                ❌ Disconnect
            </button>

        </div>

    </div>


    <!-- =====================================================
         PEERJS
    ====================================================== -->

    <script
        src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
    ></script>


    <!-- IMPORTANT:
         script.js must be in the SAME folder as index.html
    -->

    <script
        src="./script.js?v=3"
    ></script>

</body>

</html>
