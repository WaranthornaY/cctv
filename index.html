<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Web CCTV</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="title">📹 WEB CCTV</div>
        <div id="status" class="status">OFFLINE</div>
    </div>

    <main>

        <!-- LOGIN -->
        <section id="loginScreen" class="screen">

            <div class="card">

                <h1>Web CCTV</h1>
                <p class="subtitle">
                    Connect your phone camera to another device.
                </p>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter CCTV password"
                    autocomplete="off"
                >

                <div class="roleButtons">

                    <button id="cameraButton" class="role camera">
                        📱
                        <span>Camera</span>
                        <small>Use this device as the camera</small>
                    </button>

                    <button id="monitorButton" class="role monitor">
                        🖥️
                        <span>Monitor</span>
                        <small>Watch the camera</small>
                    </button>

                </div>

                <div id="error" class="error"></div>

            </div>

        </section>


        <!-- CAMERA -->
        <section id="cameraScreen" class="screen hidden">

            <div class="cameraContainer">

                <video
                    id="localVideo"
                    autoplay
                    playsinline
                    muted
                ></video>

                <div class="videoOverlay">

                    <div class="live">
                        <span></span>
                        LIVE
                    </div>

                    <div id="cameraClock">00:00:00</div>

                </div>

            </div>

            <div class="controls">

                <button id="flipCamera">
                    🔄 Flip Camera
                </button>

                <button id="cameraStop" class="danger">
                    ✖ Disconnect
                </button>

            </div>

            <div class="connectionText" id="cameraConnection">
                Waiting for monitor...
            </div>

        </section>


        <!-- MONITOR -->
        <section id="monitorScreen" class="screen hidden">

            <div class="monitorContainer">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>

                <div id="waitingMessage" class="waiting">

                    <div class="spinner"></div>

                    <h2>Waiting for camera...</h2>

                    <p>
                        Open this website on the phone,
                        select Camera, and enter the same password.
                    </p>

                </div>

                <div class="videoOverlay">

                    <div id="monitorLive" class="live hidden">
                        <span></span>
                        LIVE
                    </div>

                    <div id="monitorClock">00:00:00</div>

                </div>

            </div>

            <div class="controls">

                <button id="fullscreen">
                    ⛶ Fullscreen
                </button>

                <button id="monitorStop" class="danger">
                    ✖ Disconnect
                </button>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
